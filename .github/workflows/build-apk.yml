name: Build APK Narindo ID Card

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NarindoIDCard-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Rilis APK (Releases → mudah diunduh dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Narindo ID Card — build ${{ github.run_number }}
          body: APK otomatis dari commit ${{ github.sha }}. Unduh file .apk di bawah lalu install di HP Android.
          files: app/build/outputs/apk/release/*.apk
